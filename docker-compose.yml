services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql-db:3306/rate_limiter_db}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-root}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-dhruvil2207}
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      - mysql-db

  mysql-db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=rate_limiter_db
      - MYSQL_ROOT_PASSWORD=dhruvil2207
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
